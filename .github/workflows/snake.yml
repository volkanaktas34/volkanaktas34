name: Generate Snake Animation

on:
  schedule:
    # Her 24 saatte bir otomatik çalışır
    - cron: "0 0 * * *"
  
  # Action'ı dilediğiniz zaman manuel tetiklemenizi sağlar
  workflow_dispatch:

  # Ana dala her push yapıldığında çalışır
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # GitHub katkı grafiğinden snake animasyonu üreten adım
      - name: generate-github-contribution-grid-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Üretilen SVG dosyalarını 'output' dalına yükleyen adım
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
